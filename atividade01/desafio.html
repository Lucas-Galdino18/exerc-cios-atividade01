<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Desafio Escola </title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f0f0f0;
        }

        /* cabecalho*/
        .topo {
            background: linear-gradient(to right, navy, blue);
            color: white;
            padding: 15px;
        }

        /* banner principal de 3 cores */
        .banner {
            background: linear-gradient(to right, darkblue, red);
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        /* botoes */
        .btn {
            background: linear-gradient(to bottom, #0066cc, #003366);
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
        }

        /* cards */
        .card {
            background: linear-gradient(to bottom, white, #ddd);
            border: 1px solid #ccc;
            padding: 15px;
            margin: 15px;
        }

        /* rodape */
        .rodape {
            background: linear-gradient(to right, black, #333);
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="topo">
        <h2>Escola  SENAI</h2>
    </div>

    <div class="banner">
        <h1>Bem-vindo à Escola !</h1>
        <p>Confira os cursos disponíveis para 2026</p>
        <br>
        <button class="btn">Saber Mais</button>
    </div>

    <br>

    <div class="card">
        <h3>Desenvolvimento de Sistemas</h3>
        <p>Aprenda a programar sites e sistemas.</p>
        <button class="btn">Ver Curso</button>
    </div>

    <div class="card">
        <h3>Eletroeletrônica</h3>
        <p>Aprenda sobre comandos elétricos.</p>
        <button class="btn">Ver Curso</button>
    </div>

    <div class="card">
        <h3>Mecatrônica</h3>
        <p>Aprenda sobre automação e robótica.</p>
        <button class="btn">Ver Curso</button>
    </div>

    <br>

    <div class="rodape">
        <p>Escola Técnica SENAI - 2026</p>
    </div>

</body>
</html>
