<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 1</title>
    <style>
        .banner1 {
            background: linear-gradient(blue, green);
            min-height: 200px;
            text-align: center;
        }

        .banner2 {
            background: linear-gradient(black, gray);
            min-height: 200px;
            text-align: center;
        }

        .banner3 {
            background: linear-gradient(purple, pink, orange);
            min-height: 200px;
            text-align: center;
        }

        h2 {
            color: white;
            padding-top: 80px;
        }
    </style>
</head>
<body>

    <div class="banner1">
        <h2>Banner 1</h2>
    </div>

    <br>

    <div class="banner2">
        <h2>Banner 2</h2>
    </div>

    <br>

    <div class="banner3">
        <h2>Banner 3</h2>
    </div>

</body>
</html>
